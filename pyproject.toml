[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tak-feeder-hsl"
dynamic = ["version"]
description = "HSL (Helsinki Regional Transport) real-time vehicles to TAK"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Stefan Gofferje" }, { name = "Street3r" }]
requires-python = ">=3.12"
dependencies = [
    "pytak[with-aiohttp]>=7.5.2,<8",
    "paho-mqtt>=2.1,<3",
]

[project.scripts]
tak-feeder-hsl = "tak_feeder_hsl.__main__:run"

[tool.setuptools.dynamic]
version = { attr = "tak_feeder_hsl.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]
